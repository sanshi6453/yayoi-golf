<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>やよい会グランドゴルフ月例会 成績結果メール送信用</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:17px;color:#edf4ff;background:#09162e}
*{box-sizing:border-box}body{margin:0;padding:18px 12px 32px}.wrap{max-width:800px;margin:0 auto}
.phone-example{color:#fff;font-weight:800;text-decoration:underline;text-decoration-color:#9ed8ff;text-decoration-thickness:2px}h1{font-size:clamp(1.05rem,4.4vw,1.35rem);line-height:1.45;letter-spacing:.025em;margin:0 0 10px;color:#fff;font-weight:750;text-align:center}h1 span{display:block;color:#d8e6fb;font-size:.88em;font-weight:650;margin-top:2px}.lead{margin:0 0 16px;color:#c4d3eb;line-height:1.6}
.panel{background:#10254a;border:1px solid #294a78;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #00000026}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}.field{min-width:0}.field label{display:block;font-weight:700;font-size:.92rem;margin:0 0 6px;color:#edf4ff}.field input{display:block;width:100%;min-width:0;max-width:100%;min-height:54px;padding:12px;border:1px solid #8ca6ca;border-radius:8px;background:#f8fbff;font:inherit;font-size:1.05rem;color:#17243a}
#date{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}#date::-webkit-calendar-picker-indicator{opacity:1}fieldset{border:1px solid #355783;border-radius:10px;margin:15px 0 0;padding:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.female{background:#704658;border-color:#a9788d}.female legend,.female .field label{color:#fff}.female .field input{border-color:#d7b7c4}legend{font-weight:700;padding:0 7px;color:#fff}.rank-fields{display:grid;gap:10px}
.output-label{font-weight:700;display:block;margin:0 0 6px;color:#fff}.subject{font-weight:600}.output{width:100%;min-height:250px;resize:vertical;padding:12px;border:1px solid #8ca6ca;border-radius:8px;background:#f8fbff;color:#17243a;font:inherit;line-height:1.65;white-space:pre-wrap}.subject.output{min-height:48px;resize:none}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{min-height:54px;border:0;border-radius:9px;padding:12px 16px;font:inherit;font-size:1rem;font-weight:700;cursor:pointer}.primary{background:#2764c5;color:#fff}.secondary{background:#dce8f8;color:#10254a}.actions button:disabled{opacity:.5;cursor:not-allowed}.status{margin:10px 0 0;min-height:1.4em;color:#d4e2f6;font-size:.92rem}.note{font-size:.88rem;color:#c4d3eb;line-height:1.6;margin:12px 0 0}
@media(max-width:580px){body{padding:13px 9px 24px}.panel{padding:13px}.grid,.columns{grid-template-columns:1fr}.actions button{width:100%}.output{font-size:.96rem}}
</style>
</head>
<body>
<main class="wrap">
<h1>やよい会グランドゴルフ月例会<span>成績結果メール送信用</span></h1>
<p class="lead">開催日・連絡先電話番号・入賞者を入力してください。<br>件名・本文を作成し、メールアプリに宛先も入れます。</p>
<section class="panel" aria-label="開催日と入賞者の入力">
<div class="field"><label for="date">開催日</label><input id="date" type="date" required></div>
<div class="columns">
<fieldset><legend>男子</legend><div class="rank-fields">
<div class="field"><label for="m1">1位</label><input id="m1" autocomplete="off" required></div>
<div class="field"><label for="m2">2位</label><input id="m2" autocomplete="off" required></div>
<div class="field"><label for="m3">3位</label><input id="m3" autocomplete="off" required></div>
</div></fieldset>
<fieldset class="female"><legend>女子</legend><div class="rank-fields">
<div class="field"><label for="f1">1位</label><input id="f1" autocomplete="off" required></div>
<div class="field"><label for="f2">2位</label><input id="f2" autocomplete="off" required></div>
<div class="field"><label for="f3">3位</label><input id="f3" autocomplete="off" required></div>
</div></fieldset>
</div>
<div class="field" style="margin-top:14px"><label for="phone">連絡先電話番号（ハイフンなしで入力）</label><input id="phone" type="tel" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="電話番号を入力" required><p class="note" style="margin-top:6px">入力例（中日新聞四日市支局）：<span class="phone-example">0593523108</span> と入力 → <strong>059-352-3108</strong> と表示<br>ご自宅の番号を、ハイフンなしの数字10桁で入力してください。</p></div>
<p class="note">送信先：mie-s@chunichi.co.jp（中日新聞 スポーツ三重 係）</p>
</section>
<section class="panel" aria-label="作成されたメール">
<label class="output-label" for="subject">件名</label>
<textarea id="subject" class="output subject" readonly placeholder="開催日と入賞者を入力すると作成されます"></textarea>
<div style="height:14px"></div>
<label class="output-label" for="body">本文</label>
<textarea id="body" class="output" readonly placeholder="開催日と入賞者を入力すると作成されます"></textarea>
<div class="actions">
<button class="primary" id="openMail" disabled>メールアプリで作成</button>
<button class="secondary" id="copyAll" disabled>件名・本文をコピー</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
</section>
</main>
<script>
const ids=['date','phone','m1','m2','m3','f1','f2','f3'];
const weekday=['日','月','火','水','木','金','土'];
const $=id=>document.getElementById(id);
function allFilled(){return ids.every(id=>$(id).value.trim()!=='');}
function formatDate(s){const d=new Date(s+'T12:00:00');return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}（${weekday[d.getDay()]}）`;}
function formatPhone(s){const digits=s.replace(/\D/g,'');return digits.length===10?`${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`:'';}
function make(){
  if(!allFilled()||!formatPhone($('phone').value)){$('subject').value='';$('body').value='';['copyAll','openMail'].forEach(id=>$(id).disabled=true);return;}
  const d=formatDate($('date').value);
  const subject=`やよい会グランドゴルフ月例会 成績結果（${d}）`;
  const body=[
    '中日新聞',
    'スポーツ三重 係',
    '',
    'やよい会グランドゴルフ月例会',
    '成績結果',
    '',
    `開催日　${d}`,
    '場所　　三交かわしま園３号公園',
    '',
    '成績',
    '男子',
    `① ${$('m1').value.trim()}`,
    `② ${$('m2').value.trim()}`,
    `③ ${$('m3').value.trim()}`,
    '',
    '女子',
    `① ${$('f1').value.trim()}`,
    `② ${$('f2').value.trim()}`,
    `③ ${$('f3').value.trim()}`,
    '',
    '送信者：前 和憲',
    `電話：${formatPhone($('phone').value)}`,
    '',
    '以上、よろしくお願いします。'
  ].join('\n');
  $('subject').value=subject;$('body').value=body;
  ['copyAll','openMail'].forEach(id=>$(id).disabled=false);
}
ids.forEach(id=>$(id).addEventListener('input',make));
$('phone').addEventListener('blur',()=>{const formatted=formatPhone($('phone').value);if(formatted){$('phone').value=formatted;make();}});
async function copy(text){
  try{await navigator.clipboard.writeText(text);return true;}catch(e){
    const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok;
  }
}
$('copyAll').addEventListener('click',async()=>{$('status').textContent=await copy(`件名：${$('subject').value}\n\n${$('body').value}`)?'件名と本文をコピーしました。':'コピーできませんでした。';});
$('openMail').addEventListener('click',()=>{location.href=`mailto:mie-s@chunichi.co.jp?subject=${encodeURIComponent($('subject').value)}&body=${encodeURIComponent($('body').value)}`;});
</script>
</body>
</html>
