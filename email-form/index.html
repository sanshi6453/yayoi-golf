<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やよい会グランドゴルフ月例会 成績結果メール送信用</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;font-size:17px;color:#202124;background:#f4f5f6}
*{box-sizing:border-box}body{margin:0;padding:18px 12px 32px}.wrap{max-width:800px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 7px}.lead{margin:0 0 16px;color:#555;line-height:1.6}
.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 7px #0000000a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}.field label{display:block;font-weight:700;font-size:.92rem;margin:0 0 6px}.field input{width:100%;min-height:54px;padding:12px;border:1px solid #888;border-radius:8px;background:#fff;font:inherit;font-size:1.05rem;color:#222}
fieldset{border:1px solid #d9d9d9;border-radius:10px;margin:15px 0 0;padding:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}legend{font-weight:700;padding:0 7px}.rank-fields{display:grid;gap:10px}
.output-label{font-weight:700;display:block;margin:0 0 6px}.subject{font-weight:600}.output{width:100%;min-height:250px;resize:vertical;padding:12px;border:1px solid #bbb;border-radius:8px;background:#fff;font:inherit;line-height:1.65;white-space:pre-wrap}.subject.output{min-height:48px;resize:none}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions button{min-height:54px;border:0;border-radius:9px;padding:12px 16px;font:inherit;font-size:1rem;font-weight:700;cursor:pointer}.primary{background:#222;color:#fff}.secondary{background:#e9eaec;color:#222}.actions button:disabled{opacity:.45;cursor:not-allowed}.status{margin:10px 0 0;min-height:1.4em;color:#444;font-size:.92rem}.note{font-size:.88rem;color:#555;line-height:1.6;margin:12px 0 0}
@media(max-width:580px){body{padding:13px 9px 24px}.panel{padding:13px}.grid,.columns{grid-template-columns:1fr}.actions button{width:100%}.output{font-size:.96rem}}
</style>
</head>
<body>
<main class="wrap">
<h1>やよい会グランドゴルフ月例会 成績結果メール送信用</h1>
<p class="lead">開催日と入賞者だけ入力してください。件名・本文を作成し、メールアプリに宛先も入れます。</p>
<section class="panel" aria-label="開催日と入賞者の入力">
<div class="field"><label for="date">開催日</label><input id="date" type="date" required></div>
<div class="columns">
<fieldset><legend>男子</legend><div class="rank-fields">
<div class="field"><label for="m1">1位</label><input id="m1" autocomplete="off" required></div>
<div class="field"><label for="m2">2位</label><input id="m2" autocomplete="off" required></div>
<div class="field"><label for="m3">3位</label><input id="m3" autocomplete="off" required></div>
</div></fieldset>
<fieldset><legend>女子</legend><div class="rank-fields">
<div class="field"><label for="f1">1位</label><input id="f1" autocomplete="off" required></div>
<div class="field"><label for="f2">2位</label><input id="f2" autocomplete="off" required></div>
<div class="field"><label for="f3">3位</label><input id="f3" autocomplete="off" required></div>
</div></fieldset>
</div>
<p class="note">送信先：mie-s@chunichi.co.jp（中日新聞 スポーツ三重 係）</p>
</section>
<section class="panel" aria-label="作成されたメール">
<label class="output-label" for="subject">件名</label>
<textarea id="subject" class="output subject" readonly placeholder="開催日と入賞者を入力すると作成されます"></textarea>
<div style="height:14px"></div>
<label class="output-label" for="body">本文</label>
<textarea id="body" class="output" readonly placeholder="開催日と入賞者を入力すると作成されます"></textarea>
<div class="actions">
<button class="primary" id="openMail" disabled>メールアプリで作成</button>
<button class="secondary" id="copyAll" disabled>件名・本文をコピー</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
</section>
</main>
<script>
const ids=['date','m1','m2','m3','f1','f2','f3'];
const weekday=['日','月','火','水','木','金','土'];
const $=id=>document.getElementById(id);
function allFilled(){return ids.every(id=>$(id).value.trim()!=='');}
function formatDate(s){const d=new Date(s+'T12:00:00');return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}（${weekday[d.getDay()]}）`;}
function make(){
  if(!allFilled()){$('subject').value='';$('body').value='';['copyAll','openMail'].forEach(id=>$(id).disabled=true);return;}
  const d=formatDate($('date').value);
  const subject=`やよい会グランドゴルフ月例会 成績結果（${d}）`;
  const body=[
    '中日新聞',
    'スポーツ三重 係',
    '',
    'やよい会グランドゴルフ月例会',
    '成績結果',
    '',
    `開催日　${d}`,
    '場所　　三交かわしま園３号公園',
    '',
    '成績',
    '男子',
    `① ${$('m1').value.trim()}`,
    `② ${$('m2').value.trim()}`,
    `③ ${$('m3').value.trim()}`,
    '',
    '女子',
    `① ${$('f1').value.trim()}`,
    `② ${$('f2').value.trim()}`,
    `③ ${$('f3').value.trim()}`,
    '',
    '送信者：前 和憲',
    '電話：059-321-8113',
    '',
    '以上、よろしくお願いします。'
  ].join('\n');
  $('subject').value=subject;$('body').value=body;
  ['copyAll','openMail'].forEach(id=>$(id).disabled=false);
}
ids.forEach(id=>$(id).addEventListener('input',make));
async function copy(text){
  try{await navigator.clipboard.writeText(text);return true;}catch(e){
    const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok;
  }
}
$('copyAll').addEventListener('click',async()=>{$('status').textContent=await copy(`件名：${$('subject').value}\n\n${$('body').value}`)?'件名と本文をコピーしました。':'コピーできませんでした。';});
$('openMail').addEventListener('click',()=>{location.href=`mailto:mie-s@chunichi.co.jp?subject=${encodeURIComponent($('subject').value)}&body=${encodeURIComponent($('body').value)}`;});
</script>
</body>
</html>
